<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Creative Awards 2026 | Sprints &amp; Sneakers</title>
<meta name="description" content="Every month we crown the coolest thing Sprints &amp; Sneakers made. Explore all winning cases of this year and see why each one won.">
<meta name="theme-color" content="#0b0a09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0a09;
  --panel:#141210;
  --panel-2:#1a1714;
  --ink:#ede9e3;
  --ink-70:rgba(237,233,227,.68);
  --ink-45:rgba(237,233,227,.42);
  --line:rgba(237,233,227,.12);
  --line-strong:rgba(237,233,227,.26);
  --accent:#A6FF00;
  --accent-soft:rgba(166,255,0,.10);
  --accent-border:rgba(166,255,0,.5);
  --mono:"IBM Plex Mono", ui-monospace, monospace;
  --serif:"Lora", Georgia, serif;
  --maxw:1180px;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg); scroll-behavior:smooth; overflow-x:hidden}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--mono); font-size:13px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{color:inherit; text-decoration:none}
img{max-width:100%; display:block}
h1,h2,h3,p,blockquote,figure{margin:0}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
:focus-visible{outline:1px solid var(--accent); outline-offset:3px}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 80px}
@media (max-width:1199px){ .wrap{padding:0 44px} }
@media (max-width:809px){ .wrap{padding:0 20px} }

/* ---------- labels ---------- */
.kicker{font-family:var(--mono); font-weight:300; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--ink-45)}
.nav-label{font-family:var(--mono); font-weight:300; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink)}

/* ---------- header ---------- */
header.site{display:flex; align-items:center; justify-content:space-between; padding:30px 80px; border-bottom:1px solid var(--line)}
@media (max-width:1199px){ header.site{padding:24px 44px} }
@media (max-width:809px){ header.site{padding:20px} }
.wordmark{font-family:var(--serif); font-style:italic; font-size:18px}
nav.main-nav{display:flex; align-items:center; gap:34px}
@media (max-width:809px){ nav.main-nav{gap:18px} }
nav.main-nav a{position:relative; padding:4px 0}
nav.main-nav a .rule{display:block; height:1px; width:0; background:var(--ink); transition:width .25s}
nav.main-nav a:hover .rule{width:100%}
nav.main-nav a.accent{color:var(--accent)}
nav.main-nav a.accent .rule{background:var(--accent)}
.nav-label.clock{color:var(--ink-45); cursor:default; letter-spacing:1.5px}
@media (max-width:809px){ .nav-label.clock{display:none} }

/* ---------- buttons / pills ---------- */
.btn{display:inline-flex; align-items:center; gap:10px; padding:13px 24px; border:1px solid var(--accent); color:var(--ink); font-family:var(--mono); font-size:11px; letter-spacing:1.5px; text-transform:uppercase; transition:background .2s,color .2s}
.btn:hover{background:var(--accent); color:#0b0a09}
.btn--ghost{border-color:var(--line)}
.btn--ghost:hover{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.pill{display:inline-flex; align-items:center; padding:6px 14px; border:1px solid var(--line); font-family:var(--mono); font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-70)}
.pill--accent{border-color:var(--accent-border); color:var(--accent); background:var(--accent-soft)}

/* ---------- breadcrumb ---------- */
.crumb{display:flex; gap:10px; align-items:center; font-family:var(--mono); font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-45); margin-bottom:22px; flex-wrap:wrap}
.crumb a{color:var(--ink-70)}
.crumb a:hover{color:var(--accent)}
.crumb [aria-current]{color:var(--ink)}

/* ---------- photo (never cropped) ---------- */
.photo{position:relative; overflow:hidden; aspect-ratio:var(--ar,1/1); background:linear-gradient(160deg,#201d19,#0b0a09)}
.photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain}
.photo .ph{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--serif); font-style:italic; font-size:2rem; color:var(--ink-45)}
.mosaic{display:flex; flex-wrap:wrap; justify-content:center; gap:3px}
.mosaic .photo{width:calc((100% - 6px) / 3)}
.mosaic .ph{font-size:1rem}

/* ---------- hero ---------- */
.hero{min-height:82vh; display:flex; flex-direction:column; justify-content:space-between; padding:50px 80px 40px; position:relative; border-bottom:1px solid var(--line); overflow:hidden}
@media (max-width:1199px){ .hero{padding:40px 44px 32px; min-height:74vh} }
@media (max-width:809px){ .hero{min-height:64vh; padding:32px 20px 28px} }

.hero__mid{flex:1; display:flex; align-items:center; justify-content:center; padding:30px 0}
.glitch{display:flex; align-items:center; justify-content:center; gap:28px; flex-wrap:wrap; text-align:center; font-family:var(--serif); font-weight:400; font-size:clamp(42px,9vw,128px); line-height:.94; letter-spacing:-1px}
@media (max-width:809px){ .glitch{gap:14px; font-size:clamp(32px,12vw,60px)} }
.gw{position:relative; color:var(--ink); display:inline-block; white-space:nowrap}
.lc{display:inline-block}
.lc--active{color:var(--accent)}
.gx{width:56px; height:56px; flex:none; position:relative; border:1px solid var(--line); border-radius:50%; animation:spin 3.2s linear infinite}
@media (max-width:809px){ .gx{width:30px; height:30px} }
.gx::before,.gx::after{content:""; position:absolute; top:50%; left:50%; width:58%; height:1.5px; background:var(--accent)}
.gx::before{transform:translate(-50%,-50%) rotate(45deg)}
.gx::after{transform:translate(-50%,-50%) rotate(-45deg)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .gx{animation:none} }

/* ---------- magnifier lens over the hero title ---------- */
.lens{position:fixed; width:220px; height:220px; border-radius:50%; overflow:hidden; pointer-events:none; opacity:0; transform:scale(.92); transition:opacity .15s, transform .15s; z-index:60; border:1px solid var(--line-strong); background:var(--bg); box-shadow:0 25px 60px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.05)}
.lens.active{opacity:1; transform:scale(1)}
.lens__inner{position:absolute; top:0; left:0; white-space:nowrap; transform-origin:0 0}
@media (max-width:809px){ .lens{display:none} }

.hero__bottom{display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap}
@media (max-width:809px){ .hero__bottom{flex-direction:column; align-items:flex-start; gap:20px} }
.hero__kicker{max-width:46ch; display:flex; flex-direction:column; gap:14px}
.hero__kicker p{font-family:var(--mono); font-size:12px; line-height:1.6; color:var(--ink-70)}
.hero__cta{font-family:var(--mono); font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--accent); align-self:flex-start}
.hero__cta:hover{text-decoration:underline}
.hero__origin{text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:10px}
@media (max-width:809px){ .hero__origin{align-items:flex-start; text-align:left} }
.scroll-cue{display:flex; align-items:center; gap:10px; justify-content:flex-end}
@media (max-width:809px){ .scroll-cue{justify-content:flex-start} }
.scroll-track{width:1px; height:34px; background:linear-gradient(var(--ink-45),transparent)}

/* ---------- marquee ---------- */
.marquee-wrap{overflow:hidden; border-bottom:1px solid var(--line); padding:26px 0; display:flex; align-items:center}
@media (max-width:809px){ .marquee-wrap{padding:16px 0} }
@keyframes mq{from{transform:translate3d(0,0,0)} to{transform:translate3d(-50%,0,0)}}
.marquee-track{display:flex; width:max-content; white-space:nowrap; animation:mq 38s linear infinite}
.marquee-track span.item{display:flex; align-items:center; flex-shrink:0}
.marquee-track .word{font-family:var(--serif); font-style:italic; font-weight:400; font-size:clamp(28px,4.4vw,52px); line-height:1; letter-spacing:-.01em; white-space:nowrap}
.marquee-track .word.mono{font-family:var(--mono); font-style:normal; font-weight:400; text-transform:uppercase; letter-spacing:-.01em; font-size:clamp(24px,3.8vw,42px)}
.marquee-track .x{margin:0 44px; color:var(--accent); flex-shrink:0}
@media (max-width:809px){ .marquee-track .x{margin:0 26px} }
.diamond{display:inline-block; width:14px; height:14px; position:relative; flex:none}
.diamond::before{content:""; position:absolute; inset:0; border:1.4px solid var(--accent); transform:rotate(45deg)}

/* ---------- next award (September) ---------- */
.next-award{padding:90px 80px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; align-items:center; text-align:center; gap:18px}
@media (max-width:1199px){ .next-award{padding:64px 44px} }
@media (max-width:809px){ .next-award{padding:48px 20px} }
.next-award h2{font-family:var(--serif); font-weight:400; font-size:clamp(26px,4vw,42px); line-height:1.18; max-width:18ch}
.next-award .rules{font-family:var(--serif); font-size:clamp(16px,2vw,19px); line-height:1.55; max-width:52ch; color:var(--ink)}
.next-award .intro{font-family:var(--mono); font-size:12px; line-height:1.65; max-width:56ch; color:var(--ink-70)}
.next-award blockquote{position:relative; padding-top:22px; font-family:var(--serif); font-style:italic; font-size:clamp(17px,2.1vw,21px); line-height:1.5; max-width:50ch; color:var(--ink)}
.next-award blockquote::before{content:""; position:absolute; top:0; left:50%; transform:translateX(-50%); width:40px; height:2px; background:var(--accent)}

/* ---------- section head ---------- */
.sec-head{display:flex; justify-content:space-between; align-items:center; padding:0 0 44px}
@media (max-width:809px){ .sec-head{flex-direction:column; align-items:flex-start; gap:14px; padding-bottom:28px} }
.sec-head .title{font-family:var(--mono); font-weight:300; font-size:11px; letter-spacing:1.5px; text-transform:uppercase}

/* ---------- work / winners ---------- */
.work{padding:100px 0; border-bottom:1px solid var(--line)}
@media (max-width:1199px){ .work{padding:76px 0} }
@media (max-width:809px){ .work{padding:56px 0} }
.work-track{display:flex; gap:24px; overflow-x:auto; padding:0 80px 14px; margin:0 -80px; scroll-snap-type:x proximity}
@media (max-width:1199px){ .work-track{padding:0 44px 14px; margin:0 -44px; gap:20px} }
@media (max-width:809px){ .work-track{padding:0 20px 14px; margin:0 -20px; gap:16px} }
.work-card{flex:none; width:290px; scroll-snap-align:start; display:flex; flex-direction:column; gap:14px; border:1px solid var(--line); padding:14px; transition:border-color .2s}
.work-card:hover{border-color:var(--line-strong)}
@media (max-width:809px){ .work-card{width:230px} }
.work-card__cover{position:relative; border:1px solid var(--line); overflow:hidden; background:linear-gradient(150deg,#1c1a17,#0b0a09)}
.work-card__cover .mono-tag{position:absolute; left:10px; top:10px; z-index:2; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--accent); background:rgba(11,10,9,.72); padding:5px 10px; border:1px solid var(--accent-border)}
.work-card__meta{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.work-card__meta h2{font-family:var(--serif); font-weight:400; font-size:19px; line-height:1.2}
.work-card__meta .yr{font-size:11px; color:var(--ink-45); white-space:nowrap}
.work-card__disc{font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-45)}
.work-card__cta{margin-top:auto; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-70); display:flex; align-items:center; gap:8px}
.work-card:hover .work-card__cta{color:var(--accent)}

/* ---------- stats ---------- */
.practice{padding:100px 0; border-bottom:1px solid var(--line)}
@media (max-width:1199px){ .practice{padding:76px 0} }
@media (max-width:809px){ .practice{padding:56px 0} }
.pgrid{display:grid; grid-template-columns:repeat(3,minmax(50px,1fr)); gap:48px; border-top:1px solid var(--line); padding-top:44px}
@media (max-width:809px){ .pgrid{grid-template-columns:1fr; gap:40px} }
.pcell{display:flex; flex-direction:column; gap:14px}
.pcell .num{font-size:11px; color:var(--ink-45); letter-spacing:1.5px}
.pcell .val{font-family:var(--serif); font-weight:400; font-size:clamp(40px,5.6vw,58px); line-height:1; color:var(--accent)}
.pcell .lbl{font-size:12px; color:var(--ink-70); max-width:26ch; line-height:1.55}

/* ---------- upcoming / principles ---------- */
.principles{padding:100px 0; border-bottom:1px solid var(--line)}
@media (max-width:1199px){ .principles{padding:76px 0} }
@media (max-width:809px){ .principles{padding:56px 0} }
.prow{display:flex; align-items:flex-start; gap:60px; width:100%; padding:40px 0; border-top:1px solid var(--line)}
@media (max-width:809px){ .prow{flex-direction:column; gap:10px; padding:28px 0} }
.prow .pnum{width:60px; flex:none; font-size:11px; color:var(--ink-45); padding-top:10px}
@media (max-width:809px){ .prow .pnum{width:auto; padding-top:0} }
.prow .pbody{flex:1; display:flex; flex-direction:column; gap:10px; min-width:0}
.prow h2{font-family:var(--serif); font-weight:400; font-size:clamp(20px,2.6vw,30px); line-height:1.2}
.prow .ptag{font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-45)}
.prow .pdesc{font-family:var(--mono); font-size:12px; color:var(--ink-70); max-width:48ch; line-height:1.55}
.prow .pcta{font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--accent); align-self:flex-start; margin-top:4px}
.prow.is-next .ptag{color:var(--accent)}

/* ---------- CTA (mid-page) ---------- */
.cta{padding:90px 80px; border-bottom:1px solid var(--line); text-align:center}
@media (max-width:1199px){ .cta{padding:64px 44px} }
@media (max-width:809px){ .cta{padding:48px 20px} }
.cta__inner{max-width:620px; margin:0 auto; display:flex; flex-direction:column; align-items:center; gap:18px}
.cta h2{font-family:var(--serif); font-weight:400; font-size:clamp(24px,3.4vw,36px); line-height:1.2}
.cta p{font-family:var(--mono); font-size:12px; line-height:1.65; color:var(--ink-70); max-width:52ch}

/* ---------- footer ---------- */
footer.site{padding:140px 80px 46px}
@media (max-width:1199px){ footer.site{padding:110px 44px 32px} }
@media (max-width:809px){ footer.site{padding:80px 20px 24px} }
.say-hello{display:inline-flex; align-items:flex-end; gap:18px; margin-bottom:60px}
.say-hello h2{font-family:var(--serif); font-weight:400; font-size:clamp(44px,8.5vw,130px); line-height:1; letter-spacing:-2px}
.say-hello .arrow{font-family:var(--serif); font-size:clamp(26px,4vw,54px); line-height:1}
.foot-links{display:flex; flex-wrap:wrap; gap:30px; padding:40px 0; border-top:1px solid var(--line)}
.foot-links span{cursor:default}
.foot-colophon{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; font-size:11px; color:var(--ink-45); letter-spacing:1px; text-transform:uppercase}
.foot-colophon .right{display:flex; align-items:center; gap:20px}
.foot-colophon span{cursor:default}

/* ---------- case hero ---------- */
.case-hero{padding:150px 80px 50px; border-bottom:1px solid var(--line); display:grid; gap:36px}
@media (max-width:900px){ .case-hero{grid-template-columns:1fr; } }
@media (min-width:901px){ .case-hero{grid-template-columns:1fr 340px; align-items:start} }
@media (max-width:1199px){ .case-hero{padding:120px 44px 40px} }
@media (max-width:809px){ .case-hero{padding:100px 20px 32px} }
.case-top{display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:24px}
.case-hero h1{font-family:var(--serif); font-weight:400; font-size:clamp(30px,5vw,54px); line-height:1.1}
.case-client{font-family:var(--mono); font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-45); margin-top:14px}
.case-why{font-family:var(--serif); font-size:18px; line-height:1.6; color:var(--ink-70); max-width:62ch; margin-top:22px}
.case-why strong{color:var(--ink)}

/* winner card */
.winner-card{border:1px solid var(--line); padding:20px; display:flex; flex-direction:column; gap:14px}
.winner-card__label{font-family:var(--mono); font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-45)}
.winner-card .solo .photo{border:1px solid var(--line)}
.winner-card__name{font-family:var(--serif); font-size:22px}
.winner-card__sub{font-family:var(--mono); font-size:11px; color:var(--ink-45); margin-top:2px}
.team-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
.team-grid .member{display:flex; flex-direction:column; gap:8px}
.team-grid .member .photo{border:1px solid var(--line)}
.team-grid .member:first-child{grid-column:1/-1}
.member__name{font-family:var(--serif); font-size:15px; line-height:1.2}
.member__sub{font-family:var(--mono); font-size:10px; color:var(--accent); letter-spacing:1px; text-transform:uppercase; margin-top:2px}

/* case body */
.case-body{padding:60px 80px; display:grid; gap:20px}
@media (max-width:1199px){ .case-body{padding:46px 44px} }
@media (max-width:809px){ .case-body{padding:36px 20px} }
.case-link{display:flex}
.row-2{display:grid; gap:20px}
@media (min-width:900px){ .row-2{grid-template-columns:1fr 1fr} }

.panel{border:1px solid var(--line); padding:26px; display:flex; flex-direction:column; gap:16px; min-width:0}
@media (max-width:809px){ .panel{padding:20px} }
.panel h2{font-family:var(--mono); font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-45)}
.panel p{font-family:var(--serif); font-size:16px; line-height:1.6; color:var(--ink-70); max-width:62ch}
.panel__note{font-family:var(--mono); font-size:11px; color:var(--ink-45)}

.quote{border-left:2px solid var(--accent); padding:2px 0 2px 16px}
.quote blockquote{font-family:var(--serif); font-style:italic; font-size:16px; line-height:1.5; color:var(--ink)}
.quote figcaption{margin-top:8px; font-family:var(--mono); font-size:11px; color:var(--ink-45)}

/* stat tiles */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
.tile{border:1px solid var(--line); padding:16px 18px; display:flex; flex-direction:column; gap:6px}
.tile__val{font-family:var(--serif); color:var(--accent); font-weight:400; font-size:clamp(1.6rem,3.4vw,2.3rem); line-height:1}
.tile__val--white{color:var(--ink)}
.tile__label{font-family:var(--mono); font-size:11px; color:var(--ink-70); line-height:1.4}

/* big number */
.big{display:flex; flex-direction:column; justify-content:center; gap:8px; height:100%}
.big__val{font-family:var(--serif); color:var(--accent); font-weight:400; font-size:clamp(3rem,8vw,5.2rem); line-height:.95}
.big__label{font-family:var(--mono); font-size:13px; letter-spacing:.5px; text-transform:uppercase; color:var(--ink)}
.big__note{font-family:var(--mono); font-size:12px; color:var(--ink-45)}

/* bars */
.bars{display:flex; flex-direction:column; gap:18px}
.bar__meta{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:6px}
.bar__label{font-family:var(--mono); font-size:12px; color:var(--ink-70)}
.bar__val{font-family:var(--serif); color:var(--ink); font-size:17px; white-space:nowrap}
.track{position:relative; height:16px; background:var(--panel-2); border:1px solid var(--line)}
.fill{height:100%; width:var(--w); background:var(--line-strong)}
.fill--win{background:var(--accent)}
.marker{position:absolute; top:-5px; bottom:-5px; left:var(--t); border-left:2px dashed var(--ink-45)}
.bar__note{margin-top:6px; font-family:var(--mono); font-size:11px; color:var(--ink-45)}
.legend{display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11px; color:var(--ink-45)}
.legend i{display:inline-block; width:0; height:14px; border-left:2px dashed var(--ink-45)}

/* steps */
.steps{display:grid; gap:10px}
@media (min-width:700px){ .steps{grid-template-columns:repeat(var(--n),1fr); gap:0} }
.step{position:relative; display:flex; flex-direction:row; align-items:center; gap:16px; padding:4px 0}
@media (min-width:700px){ .step{flex-direction:column; text-align:center; padding:0 10px} }
.step__mark{flex:none; width:46px; height:46px; border:1px solid var(--accent); display:grid; place-items:center; font-family:var(--mono); color:var(--accent); font-weight:500; font-size:13px; z-index:1; background:var(--bg)}
.step__text{display:flex; flex-direction:column; gap:2px}

@media (min-width:700px){ .step:not(:last-child)::after{top:23px; left:calc(50% + 32px); right:calc(-50% + 32px); height:1px} }

.pillars{display:grid; gap:12px}
@media (min-width:700px){ .pillars--2{grid-template-columns:1fr 1fr} .pillars--3{grid-template-columns:repeat(3,1fr)} }
.pillar{border:1px solid var(--line); padding:18px 20px}
.pillar h3{font-family:var(--mono); color:var(--accent); font-size:11px; letter-spacing:1px; text-transform:uppercase; margin-bottom:8px}

/* chips */

.chip{padding:7px 14px; border:1px solid var(--line); color:var(--ink); font-family:var(--mono); font-size:11px}

/* spotlight */
.spot{display:grid; gap:16px; align-items:center}
@media (min-width:600px){ .spot{grid-template-columns:140px 1fr; gap:24px} }
.spot .photo{width:140px; border:1px solid var(--line)}
.spot h3{font-family:var(--serif); color:var(--ink); font-size:19px; margin-bottom:6px}

/* takeaway */
.takeaway{border-left:3px solid var(--accent); padding:24px 26px; background:var(--accent-soft)}
.takeaway h2{font-family:var(--mono); color:var(--accent); font-size:11px; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:14px}
.takeaway li{position:relative; padding-left:22px; font-family:var(--serif); color:var(--ink-70); line-height:1.6}

.takeaway li::before{content:""; position:absolute; left:0; top:.65em; width:10px; height:2px; background:var(--accent)}
.takeaway strong{color:var(--ink)}

.gallery{display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x proximity; padding-bottom:8px; margin:0 -4px; padding-left:4px}
.shot{flex:none; scroll-snap-align:start; height:clamp(200px,32vw,360px); padding:0; border:1px solid var(--line); overflow:hidden; background:var(--panel-2)}
.shot img{height:100%; width:auto; max-width:none}
.shot:hover{border-color:var(--accent-border)}
.video{position:relative; width:100%; max-width:var(--vw,100%); aspect-ratio:var(--ratio,16/9); overflow:hidden; background:#000; border:1px solid var(--line)}
.video iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
.video video{position:absolute; inset:0; width:100%; height:100%; border:0; object-fit:contain; background:#000}
.link-out{font-family:var(--mono); color:var(--ink-70); font-size:12px; letter-spacing:.5px}
.link-out:hover{color:var(--accent)}

/* prev / next */
.case-nav{padding:40px 80px 10px; display:grid; gap:14px}
@media (max-width:1199px){ .case-nav{padding:30px 44px 10px} }
@media (max-width:809px){ .case-nav{padding:24px 20px 10px} }
@media (min-width:700px){ .case-nav{grid-template-columns:1fr auto 1fr; align-items:center} .case-nav .next{justify-self:end} }

.navlink small{font-family:var(--mono); font-size:10px; color:var(--ink-45); text-transform:uppercase; letter-spacing:1px}
.navlink span{font-family:var(--serif); font-size:16px; color:var(--ink)}
.navlink.next{text-align:right}

/* lightbox */
dialog.lightbox{width:min(1100px, calc(100% - 24px)); max-height:calc(100dvh - 24px); padding:0; border:1px solid var(--line); background:var(--panel); overflow:hidden}
dialog.lightbox::backdrop{background:rgba(0,0,0,.82)}

        { type: "chips", title: "Why prospects read it to the end", items: [
          "You read it once instead of working through six months of filings",
          "Every claim points back to the document it came from",
          "Yours to forward to your team without editing it first" ] }
      ],
      { type: "video", title: "Why it won", id: "/creative-awards/assets/september/why-they-won.mp4", ratio: "16 / 9" }
    ],
    takeaways: [
      "A genius creative choice by Miguel to scale an existing success.",
      "It enhances both results and team collaboration by replacing heavy manual work with a smart workflow."
    ]
  }
];

/* Upcoming awards (teasers) */
const UPCOMING = [
  { key: "oct", title: "October Creative Award", next: true },
  { key: "nov", title: "November Creative Award" },
  { key: "dec", title: "December Creative Award" }
];

/* ==========================================================
   HELPERS
   ========================================================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = (v = "") => String(v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const app = $("#app");
const bySlug = Object.fromEntries(WINNERS.map(w => [w.slug, w]));
const names = keys => keys.map(k => PEOPLE[k].name).join(", ");
const monthAbbr = d => { const [m, y] = d.split(" "); return `${m.slice(0, 3).toUpperCase()} ${y}`; };
const letterSpans = word => word.split("").map(ch => `<span class="lc">${esc(ch)}</span>`).join("");

const photo = (p, w = 600) =>
  `<div class="photo"><span class="ph" aria-hidden="true">${esc(p.name[0])}</span><img src="${img(p.photo, w)}" alt="${esc(p.name)}" loading="lazy" decoding="async" referrerpolicy="no-referrer"></div>`;

function crumb(items) {
  return `<nav class="crumb">
    <a href="#/">Creative Awards</a>
    ${items.map(i => `<span>/</span>${i.href ? `<a href="${i.href}">${esc(i.label)}</a>` : `<span aria-current="page">${esc(i.label)}</span>`}`).join("")}
  </nav>`;
}

function ctaSection() {
  return `<section class="cta"><div class="cta__inner">
    <h2>What's the most creative thing you did this month?</h2>
    <p>Which creative contribution from this month deserves recognition? Tell us what you made, how you came up with the idea and what improvement or impact your approach delivered. Measurable results are welcome, but not required.</p>
    <a class="btn" href="${FORM_URL}" target="_blank" rel="noopener noreferrer">Submit your work</a>
  </div></section>`;
}

/* ==========================================================
   OVERVIEW PIECES
   ========================================================== */
function cardThumb(w) {
  if (w.people.length === 1) return photo(PEOPLE[w.people[0]], 500);
  return `<div class="mosaic">${w.people.slice(0, 5).map(k => photo(PEOPLE[k], 400)).join("")}</div>`;
}

function workCard(w, i) {
  return `<a class="work-card" href="#/case/${w.slug}" data-card="${w.slug}" aria-label="View case: ${esc(w.title)}">
    <div class="work-card__cover">${cardThumb(w)}<span class="mono-tag">${esc(monthAbbr(w.date))}</span></div>
    <div class="work-card__meta">
      <h2>${esc(w.title)}</h2>
      <span class="yr">${String(i + 1).padStart(2, "0")}</span>
    </div>
    <div class="work-card__disc">${esc(w.client)}</div>
    <div class="work-card__cta">View case <span aria-hidden="true">→</span></div>
  </a>`;
}

function prowHtml(u, i) {
  const isNext = !!u.next;
  return `<div class="prow${isNext ? " is-next" : ""}">
    <div class="pnum">${String(i + 1).padStart(2, "0")}</div>
    <div class="pbody">
      <div class="ptag">${isNext ? "Next up" : "Coming soon"}</div>
      <h2>${esc(u.title)}</h2>
      ${u.desc ? `<p class="pdesc">${esc(u.desc)}</p>` : ``}
      ${isNext ? `<a class="pcta" href="${OCTOBER_FORM_URL}" target="_blank" rel="noopener noreferrer">Submit your work →</a>` : ``}
    </div>
  </div>`;
}

function mqHtml() {
  const words = [
    { t: "Identity", mono: true },
    { t: "Performance", mono: false },
    { t: "Product", mono: true },
    { t: "Collaboration", mono: false },
    { t: "Made properly", mono: true }
  ];
  return words.map(w => `<span class="item"><span class="word${w.mono ? " mono" : ""}">${esc(w.t)}</span><span class="x" aria-hidden="true"><span class="diamond"></span></span></span>`).join("");
}

function renderOverview() {
  const peopleCount = new Set(WINNERS.flatMap(w => w.people)).size;
  const stats = [
    { v: WINNERS.length, l: "Winning cases so far this year" },
    { v: peopleCount, l: "Creatives recognised across the agency" },
    { v: UPCOMING.length, l: "Awards left to win in 2026" }
  ];
  const prows = [...UPCOMING, { title: "Case of the Year", desc: "The standout creative moment of 2026, voted at the end of the year." }];
  document.title = "Creative Awards 2026 | Sprints & Sneakers";

  app.innerHTML = `
  <section class="hero">
    <div class="hero__mid">
      <h1 class="glitch">
        <span class="gw">${letterSpans("Creative")}</span>
        <span class="gx" aria-hidden="true"></span>
        <span class="gw">${letterSpans("Awards")}</span>
      </h1>
    </div>
    <div class="hero__bottom">
      <div class="hero__kicker">
        <p>Every month we crown the coolest thing Sprints &amp; Sneakers made: campaigns, products, experiments and ideas from across the whole agency. Explore all winning cases of this year and see exactly why each one won.</p>
        <a class="hero__cta" href="#work" data-scroll="work">Explore all winning cases of 2026 →</a>
      </div>
      <div class="hero__origin">
        <div class="kicker">Since 2026</div>
        <div class="scroll-cue"><span class="kicker">Scroll</span><div class="scroll-track"></div></div>
      </div>
    </div>
  </section>

  <div class="marquee-wrap"><div class="marquee-track">${mqHtml()}${mqHtml()}</div></div>

  <section class="next-award">
    <span class="pill pill--accent">🎃 Halloween Edition</span>
    <h2>Too Bold to Survive.</h2>
    <p class="rules">Great ideas don't always make it out alive. This month we're not celebrating what survived, we're digging up what didn't and bringing it back to life.</p>
    <p class="intro">A partner played it safe, a budget shrank, a deadline won. Bring us your boldest concept: who it was for, what it was meant to achieve, and who (or what) killed it.</p>
    <blockquote>What's the idea you still think about in the shower, the one you'd pitch again tomorrow if someone let you?</blockquote>
    <p class="intro">🏆 €100 for 1st place, €50 for 2nd, both as a gift card of your choice. 📅 Submit by 3 November.</p>
    <a class="btn" href="${OCTOBER_FORM_URL}" target="_blank" rel="noopener noreferrer">Submit your work</a>
  </section>

  <section class="work" id="work">
    <div class="wrap"><div class="sec-head"><div class="title">All winning cases of 2026</div><span class="kicker">01 — ${String(WINNERS.length).padStart(2, "0")}</span></div></div>
    <div class="work-track">${WINNERS.map(workCard).join("")}</div>
  </section>

  <section class="practice" id="stats">
    <div class="wrap">
      <div class="sec-head" style="padding-bottom:0"><div class="title">By the numbers</div><span class="kicker">This year</span></div>
      <div class="pgrid">${stats.map((s, i) => `<div class="pcell"><div class="num">${String(i + 1).padStart(2, "0")}</div><div class="val">${esc(s.v)}</div><div class="lbl">${esc(s.l)}</div></div>`).join("")}</div>
    </div>
  </section>

  <section class="principles" id="upcoming">
    <div class="wrap">
      <div class="sec-head"><div class="title">Up next</div><span class="kicker">01 — ${String(prows.length).padStart(2, "0")}</span></div>
      ${prows.map(prowHtml).join("")}

  ${ctaSection()}`;
}

/* ==========================================================
   CASE PAGE: SECTION RENDERERS
   ========================================================== */
const R = {
  text: s => `<h2>${esc(s.title)}</h2>${s.body.map(p => `<p>${esc(p)}</p>`).join("")}` +
    (s.quote ? `<figure class="quote"><blockquote>${esc(s.quote.text)}</blockquote><figcaption>${esc(s.quote.by)}</figcaption></figure>` : ""),

  stats: s => `<h2>${esc(s.title)}</h2><div class="tiles">${s.items.map(i =>
    `<div class="tile"><span class="tile__val${i.w ? " tile__val--white" : ""}">${esc(i.v)}</span><span class="tile__label">${esc(i.l)}</span></div>`).join("")}</div>`,

  big: s => `<div class="big"><span class="big__val">${esc(s.v)}</span><span class="big__label">${esc(s.l)}</span><span class="big__note">${esc(s.n || "")}</span></div>`,

  bars: s => {
    const max = Math.max(...s.rows.map(r => r.v), s.target ? s.target.v : 0) * 1.08;
    const pct = v => (v / max * 100).toFixed(1) + "%";
    return `<h2>${esc(s.title)}</h2><div class="bars">
      ${s.rows.map(r => `<div class="bar">
        <div class="bar__meta"><span class="bar__label">${esc(r.l)}</span><span class="bar__val">${esc(r.d)}</span></div>
        <div class="track" role="img" aria-label="${esc(r.l)}: ${esc(r.d)}">
          <div class="fill ${r.tone === "win" ? "fill--win" : ""}" style="--w:${pct(r.v)}"></div>
          ${s.target ? `<span class="marker" style="--t:${pct(s.target.v)}"></span>` : ""}
        </div>
        ${r.n ? `<div class="bar__note">${esc(r.n)}</div>` : ""}
      </div>`).join("")}
      ${s.target ? `<span class="legend"><i></i>${esc(s.target.l)}</span>` : ""}
    </div>`;
  },

  steps: s => `<h2>${esc(s.title)}</h2>
    <div class="steps" style="--n:${s.items.length}">${s.items.map(i =>
      `<div class="step"><span class="step__mark">${esc(i.m)}</span><span class="step__text"><span class="step__label">${esc(i.l)}</span>${i.s ? `<span class="step__sub">${esc(i.s)}</span>` : ""}</span></div>`).join("")}</div>
    ${s.note ? `<p class="panel__note">${esc(s.note)}</p>` : ""}`,

  pillars: s => `<h2>${esc(s.title)}</h2><div class="pillars pillars--${s.cols || 2}">${s.items.map(i =>
    `<div class="pillar"><h3>${esc(i.t)}</h3><p>${esc(i.p)}</p></div>`).join("")}</div>`,

  chips: s => `<h2>${esc(s.title)}</h2><div class="chips">${s.items.map(i => `<span class="chip">${esc(i)}</span>`).join("")}</div>`,

  spotlight: s => { const p = PEOPLE[s.person]; return `<div class="spot">${photo(p, 500)}<div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></div></div>`; },

  gallery: s => `<h2>${esc(s.title)}</h2>
    <div class="gallery" role="list">${s.ids.map((id, i) =>
      `<button class="shot" type="button" role="listitem" data-zoom="${id}" aria-label="Enlarge image ${i + 1} of ${s.ids.length}"><img src="${img(id, 700)}" alt="${esc(s.title)} ${i + 1}" loading="lazy" decoding="async" referrerpolicy="no-referrer"></button>`).join("")}</div>
    <p class="panel__note">Click an image to enlarge it.</p>`,

  video: s => isLocal(s.id) ? `<h2>${esc(s.title)}</h2>
    <div class="video" style="--ratio:${s.ratio}; ${s.maxw ? `--vw:${s.maxw}` : ""}"><video src="${s.id}" controls playsinline preload="metadata"></video></div>` : `<h2>${esc(s.title)}</h2>
    <div class="video" style="--ratio:${s.ratio}; ${s.maxw ? `--vw:${s.maxw}` : ""}"><iframe src="${video(s.id)}" title="${esc(s.title)}" loading="lazy" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
    <a class="link-out" href="https://drive.google.com/file/d/${s.id}/view" target="_blank" rel="noopener noreferrer">Open the video in a new tab</a>`,

  link: s => `<a class="btn btn--ghost" href="${esc(s.href)}" target="_blank" rel="noopener noreferrer">${esc(s.label)}</a>`
};

const panel = s => `<div class="panel panel--${s.type}">${R[s.type](s)}</div>`;
const block = e => Array.isArray(e) ? `<div class="row-2">${e.map(panel).join("")}</div>` : e.type === "link" ? `<div class="case-link">${R.link(e)}</div>` : panel(e);

function winnerPanel(w) {
  if (w.people.length === 1) {
    const p = PEOPLE[w.people[0]];
    return `<aside class="winner-card" aria-label="Winner">
      <span class="winner-card__label">Creative Award winner</span>
      <div class="solo">${photo(p, 700)}</div>
      <div><div class="winner-card__name">${esc(p.name)}</div>${p.nick ? `<div class="winner-card__sub">${esc(p.nick)}</div>` : ""}</div>
    </aside>`;
  }
  return `<aside class="winner-card" aria-label="Winning team">
    <span class="winner-card__label">Creative Award winners</span>
    <div class="team-grid">${w.people.map(k => { const p = PEOPLE[k];
      return `<div class="member">${photo(p, 500)}<div><div class="member__name">${esc(p.name)}${p.nick ? ` <span style="font-size:11px;color:var(--ink-45)">(${esc(p.nick)})</span>` : ""}</div>${w.special === k ? `<div class="member__sub">Special mention</div>` : ""}</div></div>`; }).join("")}</div>
  </aside>`;
}

function renderCase(slug) {
  const w = bySlug[slug];
  const i = WINNERS.indexOf(w);
  const prev = WINNERS[i - 1], next = WINNERS[i + 1];
  document.title = `${w.title} | Creative Awards 2026 | Sprints & Sneakers`;

  app.innerHTML = `
  <article>
    <section class="case-hero">
      <div>
        <div class="case-top">
          <a class="btn btn--ghost" href="#/">← All winners</a>
          <span class="pill">${esc(w.date)}</span>
        </div>
        ${crumb([{ label: w.title }])}
        <h1>${esc(w.title)}</h1>
        <p class="case-client">${esc(w.client)}</p>
        <p class="case-why"><strong>Why it won.</strong> ${esc(w.why)}</p>
      </div>
      ${winnerPanel(w)}
    </section>

    <section class="case-body">
      ${w.sections.map(block).join("")}
      ${w.takeaways ? `<div class="takeaway"><h2>The takeaway</h2><ul>${w.takeaways.map(t => {
          const k = t.indexOf(":"); return k > 0 && k < 40 ? `<li><strong>${esc(t.slice(0, k + 1))}</strong>${esc(t.slice(k + 1))}</li>` : `<li>${esc(t)}</li>`; }).join("")}</ul></div>` : ""}
    </section>

    <nav class="case-nav">
      ${prev ? `<a class="navlink" href="#/case/${prev.slug}"><small>Previous winner, ${esc(prev.date.split(" ")[0])}</small><span>${esc(prev.title)}</span></a>` : `<span></span>`}
      <a class="btn btn--ghost" href="#/">← Back to all winners</a>
      ${next ? `<a class="navlink next" href="#/case/${next.slug}"><small>Next winner, ${esc(next.date.split(" ")[0])}</small><span>${esc(next.title)}</span></a>` : `<span></span>`}
    </nav>
  </article>
  ${ctaSection()}`;
}

/* ==========================================================
   ROUTER
   ========================================================== */
let lastSlug = null;
function route() {
  const m = location.hash.match(/^#\/case\/([\w-]+)/);
  if (m && bySlug[m[1]]) {
    lastSlug = m[1];
    renderCase(m[1]);
    window.scrollTo(0, 0);
  } else {
    renderOverview();
    const card = lastSlug && $(`[data-card="${lastSlug}"]`);
    if (card) card.scrollIntoView({ block: "center" }); else window.scrollTo(0, 0);
    lastSlug = null;
  }
  const h = $("h1", app); if (h) h.focus({ preventScroll: true });
}
window.addEventListener("hashchange", route);

/* ==========================================================
   EVENTS
   ========================================================== */
document.addEventListener("click", e => {
  const sc = e.target.closest("[data-scroll]");
  if (sc) { e.preventDefault(); const t = document.getElementById(sc.dataset.scroll); if (t) t.scrollIntoView({ behavior: "smooth" }); return; }
  const z = e.target.closest("[data-zoom]");
  if (z) { $("#lb-img").src = img(z.dataset.zoom, 1800); $("#lightbox").showModal(); }
});
$("#lb-close").addEventListener("click", () => $("#lightbox").close());
$("#lightbox").addEventListener("click", e => { if (e.target.id === "lightbox") e.target.close(); });
$("#lightbox").addEventListener("close", () => { $("#lb-img").removeAttribute("src"); });

document.addEventListener("error", e => {
  const t = e.target;
  if (t.tagName !== "IMG") return;
  const shot = t.closest(".shot");
  if (shot) shot.remove(); else t.remove();
}, true);

function fitPhoto(t) {
  const box = t.closest(".photo");
  if (box && t.naturalWidth) box.style.setProperty("--ar", `${t.naturalWidth} / ${t.naturalHeight}`);
}
document.addEventListener("load", e => { if (e.target.tagName === "IMG") fitPhoto(e.target); }, true);

route();
document.querySelectorAll(".photo img").forEach(i => { if (i.complete) fitPhoto(i); });
window.addEventListener("hashchange", () => setTimeout(() => document.querySelectorAll(".photo img").forEach(i => { if (i.complete) fitPhoto(i); }), 0));

/* live clock, Amsterdam time */
function updateClock() {
  const el = document.getElementById("clock");
  if (!el) return;
  const t = new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Amsterdam" });
  el.textContent = `AMSTERDAM ${t}`;
}
updateClock();
setInterval(updateClock, 30000);

/* title letter-scramble, loops over the hero headline (overview only) */
const SCRAMBLE_CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function scrambleLetter(span) {
  const original = span.textContent;
  if (!/[a-zA-Z]/.test(original)) return;
  let ticks = 0;
  const maxTicks = 7 + Math.floor(Math.random() * 5);
  span.classList.add("lc--active");
  const iv = setInterval(() => {
    if (ticks >= maxTicks) {
      clearInterval(iv);
      span.textContent = original;
      span.classList.remove("lc--active");
      return;
    }
    const r = SCRAMBLE_CHARS[Math.floor(Math.random() * SCRAMBLE_CHARS.length)];
    span.textContent = original === original.toLowerCase() ? r.toLowerCase() : r;
    ticks++;
  }, 45);
}
function scrambleLoop() {
  if (!reduceMotion) {
    const letters = document.querySelectorAll(".glitch .lc");
    if (letters.length) scrambleLetter(letters[Math.floor(Math.random() * letters.length)]);
  }
  setTimeout(scrambleLoop, 1100 + Math.random() * 1700);
}
scrambleLoop();

/* magnifier lens following the cursor over the hero title */
(function () {
  const lens = document.getElementById("lens");
  const inner = document.getElementById("lensInner");
  if (!lens || !inner) return;
  const Z = 2.3, R = 110;
  let active = false;

  document.addEventListener("mousemove", e => {
    const title = document.querySelector(".hero__mid .glitch");
    if (!title) { if (active) { active = false; lens.classList.remove("active"); } return; }
    const rect = title.getBoundingClientRect();
    const pad = 24;
    const within = e.clientX >= rect.left - pad && e.clientX <= rect.right + pad && e.clientY >= rect.top - pad && e.clientY <= rect.bottom + pad;
    if (!within) {
      if (active) { active = false; lens.classList.remove("active"); title.style.cursor = ""; }
      return;
    }
    if (!active) {
      inner.innerHTML = title.outerHTML;
      const clone = inner.firstElementChild;
      if (clone) { clone.style.width = rect.width + "px"; clone.style.flexWrap = "nowrap"; }
    }
    active = true;
    lens.classList.add("active");
    title.style.cursor = "none";
    const rx = e.clientX - rect.left, ry = e.clientY - rect.top;
    lens.style.left = (e.clientX - R) + "px";
    lens.style.top = (e.clientY - R) + "px";
    inner.style.transform = `translate(${R - rx * Z}px, ${R - ry * Z}px) scale(${Z})`;
  });
})();
</script>
